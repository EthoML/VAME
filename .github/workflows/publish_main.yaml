name: Publish from Main

on:
  push:
    branches:
        - main
    paths:
      - '.github/workflows/publish_main.yaml'
      - 'pyproject.toml'
      - 'src/**'

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/testing.yaml
    secrets: inherit

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install build twine

      - name: Determine tag name from pyproject.toml
        id: determine_tag
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag_name=v${version}" >> $GITHUB_OUTPUT

      - name: Check if tag exists on GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = "${{ steps.determine_tag.outputs.tag_name }}";
            let tagExists = true;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              tagExists = false;
            }
            core.info(`TAG_EXISTS=${tagExists}`);
            core.exportVariable('TAG_EXISTS', tagExists.toString());

      - name: "Skip: tag already exists"
        if: env.TAG_EXISTS == 'true'
        run: |
          echo "Tag ${{ steps.determine_tag.outputs.tag_name }} already exists for this version. Nothing to publish."

      - name: Build package
        if: env.TAG_EXISTS == 'false'
        run: python -m build

      - name: Check package metadata
        if: env.TAG_EXISTS == 'false'
        run: twine check dist/*

      # Upload before creating the tag, so a failed upload can be retried by re-running.
      # --skip-existing lets a re-run continue to the release if the upload already succeeded.
      - name: Publish to PyPI
        if: env.TAG_EXISTS == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload --skip-existing dist/*

      - name: Create GitHub Release
        if: env.TAG_EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.determine_tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.determine_tag.outputs.tag_name }}
          body: "Release for version ${{ steps.determine_tag.outputs.tag_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
